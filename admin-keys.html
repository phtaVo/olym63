<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olym63 · Quản lý API key AI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--card:rgba(255,255,255,.8);--card-b:rgba(255,255,255,.92);--text:#1f2430;--mut:#5f6675;--line:#e3e7ef;--acc:#1a73e8;--acc-s:#e8f0fe;--ok:#34a853;--bad:#d93025;--sh:0 8px 30px rgba(30,50,90,.09)}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--card:rgba(30,34,46,.8);--card-b:rgba(255,255,255,.08);--text:#eceef4;--mut:#a3a9b8;--line:#2b3040;--acc:#8ab4f8;--acc-s:rgba(138,180,248,.14);--sh:0 8px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;font:15.5px/1.6 Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(900px 500px at 8% -5%,rgba(26,115,232,.16),transparent),radial-gradient(800px 500px at 100% 0,rgba(234,67,53,.1),transparent),var(--bg);min-height:100vh}
header{position:sticky;top:10px;z-index:5;margin:10px auto 0;width:min(1100px,calc(100vw - 20px));display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;border-radius:999px;background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--card-b);box-shadow:var(--sh)}
header img{width:38px;height:38px;border-radius:50%;background:#fff}header b{font:700 18px 'Inter Tight';flex:1}
.btn{font:600 14px Inter;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,border-color .2s}.btn:hover{border-color:var(--acc);transform:translateY(-1px)}.btn.p{background:var(--acc);color:#fff;border-color:transparent}@media (prefers-color-scheme:dark){.btn.p{color:#10131a}}.btn.d{color:var(--bad)}.btn.sm{padding:6px 13px;font-size:13px}
main{width:min(1100px,calc(100vw - 24px));margin:22px auto 60px}
h1{font:800 clamp(26px,4vw,36px) 'Inter Tight';letter-spacing:-.02em;margin:8px 0 14px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--card-b);margin-bottom:18px}.tabs button{border:0;background:none;color:var(--mut);font:600 14px Inter;padding:9px 18px;border-radius:999px;cursor:pointer}.tabs button.on{background:var(--acc-s);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--card-b);box-shadow:var(--sh);border-radius:24px;padding:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.chip{display:inline-block;font:600 12px Inter;padding:3px 10px;border-radius:99px;background:var(--acc-s);color:var(--acc)}.chip.g{background:var(--line);color:var(--mut)}.chip.ok{background:rgba(52,168,83,.15);color:var(--ok)}
input,select,textarea{width:100%;font:15px Inter;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:4px 0 10px}input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
label{font-size:13px;color:var(--mut)}
.note{color:var(--mut);font-size:13.5px}
.it h3{margin:6px 0 4px;font:650 17px/1.35 'Inter Tight'}.it p{margin:0 0 6px;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000;display:block}
.vthumb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#111 center/cover;border:0;width:100%;cursor:pointer;padding:0}
.vthumb i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#d93025;font-style:normal;font-size:20px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}@media (max-width:820px){.two{grid-template-columns:1fr}}
#msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}#msg.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:600;font-size:12.5px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.btn.p{background:var(--acc);color:#fff;border-color:transparent}.btn.d{color:var(--bad)}.btn.s{padding:5px 12px;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:6px 0 16px}.kv div{padding:12px 14px;border-radius:16px;border:1px solid var(--line)}.kv b{display:block;font:700 22px 'Inter Tight'}.kv span{font-size:12.5px;color:var(--mut)}
.bar{height:8px;border-radius:9px;background:var(--acc-s);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--acc)}
.chip.bad{background:rgba(217,48,37,.12);color:var(--bad)}h2{font:700 19px 'Inter Tight';margin:0 0 10px}.mt{margin-top:18px}
.pr{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;align-items:center}.pr input{margin:0}
</style>
</head>
<body>
<header><img src="assets/logo.png?v=2" alt="" onerror="this.style.display='none'"><b>Olym63 · API key AI &amp; chi phí</b><a class="btn" href="admin-content.html">Quản trị nội dung</a><a class="btn" href="./">Về trang chính</a></header>
<main id="app"><p class="note">Đang kiểm tra quyền truy cập…</p></main>
<div id="msg"></div>
<script src="js/config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const base = () => ((typeof CONFIG !== 'undefined' && CONFIG.ACCOUNTS_API_URL) || '').replace(/\/+$/, '');
const token = () => { try { return localStorage.getItem('olympia_token'); } catch (e) { return null; } };
async function api(p, o) { o = o || {}; const r = await fetch(base() + p, Object.assign({}, o, { headers: Object.assign({ 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() }, o.headers || {}) })); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ('Lỗi ' + r.status)); return j; }
function toast(m) { const e = $('msg'); e.textContent = m; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2800); }
const N = n => Number(n || 0).toLocaleString('vi-VN');
const fmtT = t => t ? new Date(t).toLocaleString('vi-VN') : '—';
let DATA = { keys: [], usage: null }, DAYS = 30, PRICE = {}, VND = 26000, PAID = true;

async function init() {
  if (!base()) return $('app').innerHTML = '<div class="card"><p>Chưa cấu hình ACCOUNTS_API_URL trong js/config.js.</p></div>';
  let ok = false;
  if (token()) { try { const me = await api('/me'); ok = me.user && me.user.role === 'admin'; if (!ok) return $('app').innerHTML = '<div class="card"><p>Tài khoản này không có quyền admin.</p><button class="btn" onclick="logout()">Đăng nhập tài khoản khác</button></div>'; } catch (e) { ok = false; } }
  if (!ok) return loginForm();
  load();
}
function loginForm(msg) {
  $('app').innerHTML = `<div class="card" style="max-width:420px;margin:30px auto"><h2>Đăng nhập admin</h2><p class="note">Dùng tài khoản có vai trò admin của Olym63.</p>${msg ? `<p style="color:var(--bad)">${esc(msg)}</p>` : ''}<label>Tên đăng nhập</label><input id="lu" autocomplete="username"><label>Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn p" onclick="doLogin()">Đăng nhập</button></div>`;
}
async function doLogin() {
  try { const r = await fetch(base() + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('lu').value, password: $('lp').value }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Đăng nhập thất bại'); if (j.user.role !== 'admin') throw new Error('Tài khoản này không phải admin.'); localStorage.setItem('olympia_token', j.token); init(); } catch (e) { loginForm(e.message); }
}
function logout() { try { localStorage.removeItem('olympia_token'); } catch (e) {} location.reload(); }

async function load() {
  try {
    const [k, u] = await Promise.all([api('/admin/ai/keys'), api('/admin/ai/usage?days=' + DAYS)]);
    DATA = { keys: k.keys, envKeys: k.env_keys, usage: u };
    PRICE = Object.assign({}, u.prices && u.prices.models || {}); VND = (u.prices && u.prices.vnd) || VND; PAID = u.prices ? u.prices.paid !== false : true;
    draw();
  } catch (e) { $('app').innerHTML = `<div class="card"><p>${esc(e.message)}</p><p class="note">Nếu báo "Không có chức năng này", hãy deploy lại worker.js (Worker tài khoản) bản mới.</p></div>`; }
}
const priceOf = m => PRICE[m] || { in: 0.25, out: 1.5 };
const cost = (m, i, o) => (i * priceOf(m).in + o * priceOf(m).out) / 1e6;

function draw() {
  const u = DATA.usage, rows = u.by_day || [], tot = rows.reduce((a, r) => ({ c: a.c + r.calls, i: a.i + r.in_tok, o: a.o + r.out_tok, e: a.e + r.errors, $: a.$ + cost(r.model, r.in_tok, r.out_tok) }), { c: 0, i: 0, o: 0, e: 0, $: 0 });
  const models = [...new Set(rows.map(r => r.model))];
  const perCall = tot.c ? tot.$ * VND / tot.c : 0;
  const days = {}; rows.forEach(r => { const d = days[r.day] || (days[r.day] = { c: 0, i: 0, o: 0, $: 0 }); d.c += r.calls; d.i += r.in_tok; d.o += r.out_tok; d.$ += cost(r.model, r.in_tok, r.out_tok); });
  const dk = Object.keys(days).sort(), mx = Math.max(1, ...dk.map(d => days[d].c));
  const act = DATA.keys.filter(k => k.active && !k.cooling).length;
  $('app').innerHTML = `
  <h1>API key AI</h1>
  <div class="kv"><div><b>${act}/${DATA.keys.length}${DATA.envKeys ? ' + ' + DATA.envKeys : ''}</b><span>key đang sẵn sàng (+ key dự phòng trong secret)</span></div><div><b>${N(tot.c)}</b><span>lượt gọi Gemini · ${DAYS} ngày</span></div><div><b>${N(tot.i + tot.o)}</b><span>token (vào ${N(tot.i)} · ra ${N(tot.o)})</span></div><div><b>${tot.e ? N(tot.e) : '0'}</b><span>lần lỗi / hết hạn mức</span></div></div>
  <div class="card"><h2>Danh sách key</h2>
    <table><thead><tr><th>Tên</th><th>Key</th><th>Trạng thái</th><th class="n">Hôm nay</th><th class="n">Tổng</th><th>Lỗi gần nhất</th><th></th></tr></thead><tbody>
    ${DATA.keys.map(k => `<tr><td>${esc(k.label)}</td><td><code>${esc(k.key)}</code></td><td>${!k.active ? '<span class="chip g">Tắt</span>' : k.cooling ? '<span class="chip bad">Đang nghỉ đến ' + new Date(k.cooldown_until).toLocaleTimeString('vi-VN') + '</span>' : '<span class="chip ok">Sẵn sàng</span>'}</td><td class="n">${N(k.today_calls)}${k.today_errors ? ' <small style="color:var(--bad)">(' + k.today_errors + ' lỗi)</small>' : ''}</td><td class="n">${N(k.calls)}</td><td class="note" style="max-width:220px">${esc(k.last_error || '')}</td><td style="white-space:nowrap"><button class="btn s" onclick="test(${k.id},this)">Thử</button> <button class="btn s" onclick="toggle(${k.id},${k.active ? 0 : 1})">${k.active ? 'Tắt' : 'Bật'}</button> <button class="btn s" onclick="rotate(${k.id})">Đổi key</button> <button class="btn s d" onclick="del(${k.id})">Xóa</button></td></tr>`).join('') || '<tr><td colspan="7" class="note">Chưa có key trong danh sách. Thêm key đầu tiên ở bên dưới.</td></tr>'}
    </tbody></table>
    <div class="row mt"><input id="nl" placeholder="Tên gợi nhớ (vd: Key tháng 12)" style="max-width:240px;margin:0"><input id="nk" placeholder="AIza…" type="password" autocomplete="off" style="max-width:380px;margin:0"><button class="btn p" onclick="add()">Thêm key</button></div>
    <p class="note">Mỗi lần AI được gọi, hệ thống dùng key nghỉ lâu nhất. Key nào hết hạn mức sẽ tự nghỉ rồi chuyển sang key khác. Muốn <b>đổi key định kỳ</b>: thêm key mới → bấm Thử → Tắt key cũ → Xóa. Key chỉ hiển thị 6 ký tự đầu và 4 ký tự cuối.</p></div>

  <div class="card mt"><h2>Chi phí ước tính</h2>
    <div class="row" style="margin:0 0 8px"><label>Khoảng thời gian</label><select id="dd" style="width:auto;margin:0" onchange="DAYS=+this.value;load()">${[7, 14, 30, 60, 90].map(d => `<option value="${d}" ${d === DAYS ? 'selected' : ''}>${d} ngày</option>`).join('')}</select><label>1 USD =</label><input id="vnd" type="number" value="${VND}" style="width:110px;margin:0"><label>VND</label></div>
    <div class="kv"><div><b>$${tot.$.toFixed(3)}</b><span>≈ ${N(Math.round(tot.$ * VND))} đ nếu dùng gói trả phí</span></div><div><b>${N(Math.round(perCall))} đ</b><span>trung bình mỗi lượt gọi</span></div><div><b>${N(Math.round(tot.$ / Math.max(1, DAYS) * 30 * VND))} đ</b><span>dự kiến 30 ngày (theo mức này)</span></div></div>
    ${models.length ? `<p class="note" style="margin:0 0 6px">Giá mỗi 1 triệu token (USD). Giá mặc định là giá tham khảo của Google, hãy đối chiếu tại ai.google.dev/pricing rồi sửa nếu khác. Nếu key đang ở gói <b>miễn phí</b> thì chi phí thật bằng 0, số trên chỉ là mức bạn sẽ trả nếu chuyển sang trả phí.</p>` : ''}
    ${models.map(m => `<div class="pr"><code>${esc(m)}</code><div><label>Vào</label><input type="number" step="0.01" data-m="${esc(m)}" data-f="in" value="${priceOf(m).in}"></div><div><label>Ra (gồm token suy nghĩ)</label><input type="number" step="0.01" data-m="${esc(m)}" data-f="out" value="${priceOf(m).out}"></div></div>`).join('')}
    ${models.length ? '<div class="row"><button class="btn" onclick="savePrices()">Lưu giá</button></div>' : '<p class="note">Chưa có lượt gọi nào được ghi lại. Sau khi bạn thay Worker proxy bằng bản mới (thư mục gemini-proxy) và có người dùng AI, số liệu sẽ hiện ở đây.</p>'}
    ${dk.length ? `<table class="mt"><thead><tr><th>Ngày</th><th class="n">Lượt gọi</th><th>&nbsp;</th><th class="n">Token vào</th><th class="n">Token ra</th><th class="n">≈ VND</th></tr></thead><tbody>${dk.slice(-14).reverse().map(d => `<tr><td>${d}</td><td class="n">${N(days[d].c)}</td><td><div class="bar"><i style="width:${Math.round(days[d].c / mx * 100)}%"></i></div></td><td class="n">${N(days[d].i)}</td><td class="n">${N(days[d].o)}</td><td class="n">${N(Math.round(days[d].$ * VND))}</td></tr>`).join('')}</tbody></table>` : ''}
  </div>

  <div class="card mt"><h2>Giới hạn mỗi người dùng</h2>
    <p class="note">Mỗi tính năng AI trừ 1–3 “lượt” (đọc ảnh, PDF scan hoặc video tốn nhiều hơn). Giảm số lượt/ngày là cách trực tiếp nhất để giảm chi phí.</p>
    <div class="row" style="margin:0"><label>Lượt AI mỗi người mỗi ngày</label><input id="lim" type="number" min="5" max="1000" value="${u.limit}" style="width:110px;margin:0"><button class="btn p" onclick="saveLimit()">Lưu</button></div>
    ${perCall ? `<p class="note">Với mức hiện tại, một người dùng hết hạn mức ${u.limit} lượt mất tối đa khoảng <b>${N(Math.round(perCall * u.limit))} đ/ngày</b> (nếu trả phí).</p>` : ''}
    ${u.users && u.users.length ? `<table class="mt"><thead><tr><th>Người dùng nhiều nhất</th><th class="n">Lượt AI (${DAYS} ngày)</th></tr></thead><tbody>${u.users.map(x => `<tr><td>${esc(x.full_name || x.username)} <span class="note">@${esc(x.username)}</span></td><td class="n">${N(x.units)}</td></tr>`).join('')}</tbody></table>` : ''}
  </div>
  <p class="note mt"><button class="btn s" onclick="logout()">Đăng xuất</button></p>`;
}
async function add() { try { await api('/admin/ai/keys', { method: 'POST', body: JSON.stringify({ label: $('nl').value || 'Key mới', key: $('nk').value }) }); toast('Đã thêm key'); load(); } catch (e) { toast(e.message); } }
async function toggle(id, a) { try { await api('/admin/ai/keys/' + id, { method: 'PUT', body: JSON.stringify({ active: !!a }) }); load(); } catch (e) { toast(e.message); } }
async function rotate(id) { const k = prompt('Dán API key mới (bắt đầu bằng AIza…):'); if (!k) return; try { await api('/admin/ai/keys/' + id, { method: 'PUT', body: JSON.stringify({ key: k }) }); toast('Đã đổi key'); load(); } catch (e) { toast(e.message); } }
async function del(id) { if (!confirm('Xóa key này khỏi danh sách?')) return; try { await api('/admin/ai/keys/' + id, { method: 'DELETE' }); load(); } catch (e) { toast(e.message); } }
async function test(id, b) { b.disabled = true; b.textContent = '…'; try { const r = await api('/admin/ai/keys/' + id + '/test', { method: 'POST' }); toast(r.ok ? 'Key hoạt động tốt (' + r.ms + ' ms)' : 'Lỗi ' + r.status + ': ' + r.error); } catch (e) { toast(e.message); } load(); }
async function savePrices() { const models = Object.assign({}, PRICE); document.querySelectorAll('[data-m]').forEach(i => { const m = i.dataset.m; models[m] = models[m] || { in: 0.25, out: 1.5 }; models[m][i.dataset.f] = Number(i.value) || 0; }); try { await api('/admin/ai/settings', { method: 'POST', body: JSON.stringify({ prices: { models, vnd: Number($('vnd').value) || 26000, paid: true } }) }); toast('Đã lưu giá'); load(); } catch (e) { toast(e.message); } }
async function saveLimit() { try { await api('/admin/ai/settings', { method: 'POST', body: JSON.stringify({ limit: $('lim').value }) }); toast('Đã lưu giới hạn'); load(); } catch (e) { toast(e.message); } }
init();
</script>
</body>
</html>
